name: Customer template validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Check source
        run: |
          deno check supabase/functions/meta-webhook/index.ts
          deno check supabase/functions/social-worker/index.ts
          deno check supabase/functions/instagram-patrol/index.ts
      - name: Check safe defaults
        run: |
          grep -qx 'SOCIAL_SEND_ENABLED=false' .env.example
          grep -qx 'SOCIAL_TELEGRAM_ENABLED=false' .env.example
          test -s supabase/bootstrap/001_social_schema.sql
          echo 'Validation only; deployment NO_GO'
