name: Customer template validation
on:
  workflow_dispatch:
  push:
    branches: [r101-template-staging]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Check source
        run: |
          deno check supabase/functions/*/index.ts
          deno test --allow-env supabase/functions
          bash -n scripts/quick-install.sh && bash -n scripts/setup-schedule.sh
      - name: Check safe defaults
        run: |
          grep -qx 'SOCIAL_SEND_ENABLED=false' .env.example
          grep -qx 'SOCIAL_TELEGRAM_ENABLED=false' .env.example
          test -s supabase/bootstrap/001_social_schema.sql
          echo 'Validation only; deployment NO_GO'
