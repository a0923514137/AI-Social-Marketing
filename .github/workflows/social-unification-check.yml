name: Social unification candidate check
on:
  push:
    branches: [codex/r-social-unification-candidate]
    paths:
      - 'integration-candidate/**'
      - '.github/workflows/social-unification-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check integration-candidate/social-worker/index.ts
      - run: deno test --allow-env=SOCIAL_SCHEDULER_KEY,YOUTUBE_SCHEDULER_KEY,SUPABASE_URL integration-candidate/social-worker/
