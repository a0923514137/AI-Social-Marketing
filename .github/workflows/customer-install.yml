name: Customer quick install (NO_GO)
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Customer's new Supabase project reference
        required: true
        type: string
      confirm:
        description: Confirm fresh customer project (repeat project reference)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: customer-install-${{ inputs.project_ref }}
  cancel-in-progress: false
jobs:
  install:
    if: github.event.repository.private == true && vars.CUSTOMER_INSTALL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: customer-install
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Install database client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Initialize and deploy (sending disabled)
        env:
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
          CONFIRM_NEW_PROJECT: ${{ inputs.confirm }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUSTOMER_DB_URL: ${{ secrets.CUSTOMER_DB_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_WEBHOOK_VERIFY_TOKEN: ${{ secrets.FB_WEBHOOK_VERIFY_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ACCOUNT_ID: ${{ secrets.THREADS_ACCOUNT_ID }}
          FB_TOKEN_EXPIRES_AT: ${{ vars.FB_TOKEN_EXPIRES_AT }}
          IG_TOKEN_EXPIRES_AT: ${{ vars.IG_TOKEN_EXPIRES_AT }}
          THREADS_TOKEN_EXPIRES_AT: ${{ vars.THREADS_TOKEN_EXPIRES_AT }}
          META_DATA_ACCESS_EXPIRES_AT: ${{ vars.META_DATA_ACCESS_EXPIRES_AT }}
          SOCIAL_SCHEDULER_KEY: ${{ secrets.SOCIAL_SCHEDULER_KEY }}
        run: |
          bash scripts/quick-install.sh

          bash scripts/setup-schedule.sh
          python3 scripts/verify-install.py
