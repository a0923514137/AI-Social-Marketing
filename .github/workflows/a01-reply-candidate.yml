name: A01 reply candidate tests
on:
  push:
    branches: [agent01/four-platform-reply-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno test supabase/functions/shared/global_keyword_candidate_test.ts supabase/functions/shared/reply_gate_candidate_test.ts
      - run: deno test supabase/functions/social-worker/youtube_gate_test.ts
      - run: deno check supabase/functions/social-worker/youtube.ts

      - run: deno check supabase/functions/social-webhook/index.ts
