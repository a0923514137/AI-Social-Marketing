name: A01 reply candidate tests
on:
  push:
    branches: [agent01/four-platform-reply-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno test supabase/functions/shared/global_keyword_candidate_test.ts supabase/functions/shared/reply_gate_candidate_test.ts
      - run: deno test supabase/functions/social-worker/youtube_gate_test.ts
      - run: deno check supabase/functions/social-worker/index.ts

      - run: deno check supabase/functions/social-webhook/index.ts
      - run: deno test --allow-env=FB_APP_SECRET,IG_APP_SECRET supabase/functions/social-webhook/signature_test.ts

      - run: deno check supabase/functions/social-admin/index.ts
      - run: deno test --allow-env=FB_APP_SECRET,FB_PAGE_ID,FB_PAGE_ACCESS_TOKEN,IG_BUSINESS_ACCOUNT_ID,IG_USERNAME,INSTAGRAM_ACCESS_TOKEN,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SOCIAL_SEND_ENABLED supabase/functions/social-webhook/routing_test.ts
